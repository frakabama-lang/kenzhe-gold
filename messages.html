<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Сообщения</title>
<style>
body{background:#000;color:#D4AF37;font-family:Arial;text-align:center;padding:40px;}
textarea{width:80%;height:100px;background:#111;color:#D4AF37;border:1px solid #D4AF37;}
button{margin-top:10px;padding:8px 12px;background:#D4AF37;color:black;border:none;}
</style>
</head>
<body>

<h2>Написать нам</h2>

<textarea id="msg" placeholder="Введите сообщение..."></textarea><br>
<button onclick="send()">Отправить в WhatsApp</button>

<script>
function send(){
let text=document.getElementById("msg").value;
window.open("https://wa.me/77759425888?text="+encodeURIComponent(text),"_blank");
}
</script>

</body>
</html>
