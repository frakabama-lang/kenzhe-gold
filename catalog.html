<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="menu-btn" onclick="toggleMenu()">⋮</div>
<img src="logo.png" class="logo">
</header>

<div class="side-menu" id="sideMenu">
<a href="index.html">Главная</a>
<a href="catalog.html">Каталог</a>
<a href="cart.html">Корзина</a>
<a href="#" onclick="adminLogin()">Вход администратора</a>
</div>

<section class="products" id="productsContainer"></section>

<div class="bottom-nav">
<a href="index.html">🏠</a>
<a href="cart.html">🛒</a>
</div>

<script src="script.js"></script>

<script>
function loadProducts(){
let products = JSON.parse(localStorage.getItem("products")) || [];
let container = document.getElementById("productsContainer");

container.innerHTML = "";

if(products.length === 0){
container.innerHTML = "<h2>Товаров пока нет</h2>";
return;
}

products.forEach(product=>{
container.innerHTML += `
<div class="card">
<img src="${product.image}">
<h3>${product.name}</h3>
<p>${product.price} ₸</p>
<button onclick="addToCart('${product.name}','${product.price}')">В корзину</button>
<button onclick="buyNow('${product.name}')">Купить</button>
</div>
`;
});
}

loadProducts();
</script>

</body>
</html>
