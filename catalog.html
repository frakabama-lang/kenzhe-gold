<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="menu-btn" onclick="toggleMenu()">⋮</div>
<img src="logo.png" class="logo">
</header>

<div class="side-menu" id="sideMenu">
<a href="index.html">Главная</a>
<a href="catalog.html">Каталог</a>
<a href="contacts.html">Контакты</a>
<a href="cart.html">Корзина</a>
<a href="orders.html">Мои заказы</a>
<a href="messages.html">Сообщения</a>
<a href="#" onclick="adminLogin()">Вход администратора</a>
</div>

<section class="products" id="productsContainer"></section>

<div class="bottom-nav">
<a href="index.html">🏠</a>
<a href="cart.html">🛒</a>
<a href="messages.html">💬</a>
</div>

<script src="script.js"></script>

<script>
fetch("products.json")
.then(response => response.json())
.then(data => {
const container = document.getElementById("productsContainer");
container.innerHTML = "";

data.forEach(product => {
const card = document.createElement("div");
card.className = "card";

card.innerHTML = `
<img src="${product.image}">
<h3>${product.name}</h3>
<p>${product.price} ₸</p>
<button onclick="addToCart('${product.name}','${product.price}')">В корзину</button>
<button onclick="buyNow('${product.name}')">Купить</button>
`;

container.appendChild(card);
});
})
.catch(error => {
document.getElementById("productsContainer").innerHTML = "<h2>Ошибка загрузки товаров</h2>";
});
</script>

</body>
</html>
