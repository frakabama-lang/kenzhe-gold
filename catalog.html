<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyACsqskmgUJVsw3Uy4g1ZgsN3hzub-hfFo",
  authDomain: "kenzhe-gold-95af2.firebaseapp.com",
  projectId: "kenzhe-gold-95af2",
  storageBucket: "kenzhe-gold-95af2.firebasestorage.app",
  messagingSenderId: "104513272791",
  appId: "1:104513272791:web:ab1d154a46c7f9520e2992"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

function loadProducts(){
db.collection("products").get().then((querySnapshot)=>{
let container = document.getElementById("productsContainer");
container.innerHTML = "";

querySnapshot.forEach((doc)=>{
let product = doc.data();
container.innerHTML += `
<div style="border:1px solid gold;padding:15px;margin:15px;text-align:center;">
<img src="${product.image}" width="200"><br>
<h3>${product.name}</h3>
<p>${product.price} ₸</p>
<button onclick="orderNow('${product.name}','${product.price}','${product.image}')">Купить</button>
</div>
`;
});
});
}

function orderNow(name,price,image){
let message = `Здравствуйте! Хочу заказать:\n${name}\nЦена: ${price} ₸\nФото: ${image}`;
let url = "https://wa.me/77759425888?text=" + encodeURIComponent(message);
window.open(url, "_blank");
}

window.onload = loadProducts;
</script>

</head>

<body>
<h1 style="text-align:center;">Каталог</h1>
<div id="productsContainer"></div>
</body>
</html>
